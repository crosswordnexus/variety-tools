<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seven Sages Construction</title>
  <!-- Skeleton CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css" />
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css" />
  <style>
    @font-face {
      font-family: 'DejaVuSans';
      src: url('DejaVuSans.ttf') format('truetype');
    }
    #loading { font-style: italic; color: gray; }
    #spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid #ccc; border-top: 2px solid #333; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 0.5em; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    #mainUI { display: none; }
    #grid img {
      max-width: 100%;
      height: auto;
      display: block;    /* prevent inline‐image whitespace issues */
    }
    .prelike {
      white-space: pre;        /* preserve all spaces/newlines */
      font-family: monospace;  /* match the typical <pre> font */
      overflow-x: auto;        /* allow horizontal scroll if lines get long */
      font-size: 1.25em;
    }
    .button-danger,
    .button-danger:hover,
    .button-danger:focus {
      background-color: #d9534f;
      color: #fff;
      border-color: #d9534f;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- modal box placeholder -->
    <div class="cw-modal" id="cw-modal"></div>
    <h2>Seven Sages Construction</h2>
    <div id="loading"><span id="spinner"></span>Loading solver and dictionary...</div>

    <div id="mainUI">
      <ul class="tab-nav" style="list-style: none; display: flex; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-bottom: 20px;">
        <li style="margin-right: 15px; margin-bottom: 0;">
          <button class="button button-primary tab-btn" data-tab="tab-construct" type="button">Construct</button>
        </li>
        <li style="margin-bottom: 0;">
          <button class="button tab-btn" data-tab="tab-vpuz" type="button">Make vPuz</button>
        </li>
      </ul>

      <div id="tab-construct" class="tab-content">
        <div class="row">
          <div class="six columns">
            <h4>Inputs</h4>
            <form>
              <label class="label">
                <span class="label-text">Quote (must be 48 characters exactly)</span>
                <br />
                <input class="input" id="quote"></input>
              </label>
              <!-- One entry per line -->
              <textarea id="inputs" rows="34" placeholder="Enter each entry (7 letters) on its own line"></textarea>
              <br />
              <button id="generate" class="button-primary">Find next entry</button>
              <button id="undo" class="button" type="button">Undo</button>
              <button id="clear-all" class="button button-danger" type="button">Clear All</button>
            </form>

            <div id="results-loading"></div>
            <div id="results-table-div" style="margin-top: 20px;">
              <table id="datatables-table" class="display u-full-width">
                <thead>
                  <tr>
                    <th>Word</th>
                    <th>Score</th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
              <p style="font-style: italic; color: gray; margin-top: 10px;">Click a row to insert it and find the next word.</p>
            </div>

          </div>
          <div class="six columns">
            <h4>Grid</h4>
            <div id="grid">
              <img id="myImg" />
            </div>
          </div>
        </div>
      </div>

      <div id="tab-vpuz" class="tab-content" style="display: none;">
        <p>Note: after creating your vpuz you can share your puzzle using <a href="https://crosswordnexus.github.io/variety-tools/variety-solver/share.html">The Variety Puzzle Sharer</a>.
        <div class="row">
          <div class="six columns">
            <label for="vpuz-title">Title</label>
            <input type="text" id="vpuz-title" class="u-full-width" />
          </div>
          <div class="six columns">
            <label for="vpuz-author">Author</label>
            <input type="text" id="vpuz-author" class="u-full-width" />
          </div>
        </div>
        <div class="row">
          <div class="six columns">
            <label for="vpuz-copyright">Copyright</label>
            <input type="text" id="vpuz-copyright" class="u-full-width" value="© " placeholder="e.g. &copy; 2026 Crossword Nexus" />
          </div>
          <div class="six columns">
            <label for="vpuz-notes">Notes / Instructions</label>
            <textarea id="vpuz-notes" class="u-full-width" rows="4"></textarea>
          </div>
        </div>

        <hr />
        <h4>Clues</h4>
        <div id="vpuz-warning" style="display: none; color: red; font-weight: bold; margin-bottom: 15px;"></div>
        <div id="vpuz-clues-container"></div>
        <br />
        <button id="vpuz-download" class="button-primary u-full-width" style="margin-top: 20px;">Download vPuz File</button>
      </div>
    </div>

  </div> <!-- container -->

  <!-- Load jQuery and DataTables -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

  <!-- Load JS Solver and Font/Image -->
  <script type="module" src="./app.js"></script>
</body>
</html>
